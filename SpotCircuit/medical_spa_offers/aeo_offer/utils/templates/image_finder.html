<!DOCTYPE html>
<html>
<head>
    <title>Image Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-card {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.5rem;
            transition: all 0.2s;
        }
        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 0.25rem;
        }
        .image-card.selected {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .image-info {
            margin-top: 0.5rem;
        }
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            z-index: 50;
        }
        .category-tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: #e5e7eb;
            border-radius: 0.25rem;
            margin: 0.25rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .category-tag:hover {
            background: #d1d5db;
        }
        .category-tag.selected {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <div class="flex gap-4 mb-6">
                <input type="text" id="searchInput" placeholder="Search for images..." 
                    class="flex-grow px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value="medical spa"
                    onkeypress="if(event.key === 'Enter') searchImages()">
                <button onclick="searchImages()" 
                    class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Search Images
                </button>
            </div>

            <!-- Selected Images Panel -->
            <div id="selectedPanel" class="mb-6 hidden">
                <h3 class="text-lg font-semibold mb-2">Selected Images</h3>
                <div id="selectedImages" class="flex flex-wrap gap-4"></div>
                <div class="mt-4">
                    <button onclick="downloadSelected()" 
                        class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                        Download Selected
                    </button>
                </div>
            </div>
        </div>

        <!-- Image Grids -->
        <div class="grid grid-cols-2 gap-8">
            <!-- Pixabay Grid -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Pixabay Images</h2>
                    <button id="loadMorePixabay" onclick="loadMore('pixabay')" 
                        class="px-4 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">
                        Load More
                    </button>
                </div>
                <div id="pixabayGrid" class="grid grid-cols-3 gap-4">
                    <!-- Pixabay images will be inserted here -->
                </div>
            </div>

            <!-- Pexels Grid -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Pexels Images</h2>
                    <button id="loadMorePexels" onclick="loadMore('pexels')" 
                        class="px-4 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">
                        Load More
                    </button>
                </div>
                <div id="pexelsGrid" class="grid grid-cols-3 gap-4">
                    <!-- Pexels images will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    </div>

    <script>
        let currentImages = { pixabay: [], pexels: [] };
        let selectedImages = new Map();
        let availableCategories = {{ categories|tojson|safe }};
        let currentPage = { pixabay: 1, pexels: 1 };
        let isLoading = false;

        function getCategoryTags(imageId) {
            const selectedCategory = selectedImages.get(imageId)?.category || '';
            return `
                <div class="category-tags mt-2">
                    ${availableCategories.map(cat => `
                        <span class="category-tag ${cat === selectedCategory ? 'selected' : ''}"
                            onclick="event.stopPropagation(); setImageCategory('${imageId}', '${cat}')">
                            ${cat}
                        </span>
                    `).join('')}
                </div>
            `;
        }

        function setImageCategory(imageId, category) {
            if (!selectedImages.has(imageId)) return;
            
            const data = selectedImages.get(imageId);
            data.category = category;
            selectedImages.set(imageId, data);
            
            // Update category tags in both the grid and selected panel
            document.querySelectorAll(`[data-id="${imageId}"] .category-tags`).forEach(element => {
                element.outerHTML = getCategoryTags(imageId);
            });
            
            updateSelectedPanel();
        }

        function addImageToGrid(img, grid) {
            const card = document.createElement('div');
            card.className = `image-card ${selectedImages.has(img.id) ? 'selected' : ''}`;
            card.setAttribute('data-id', img.id);
            
            const categoryHtml = selectedImages.has(img.id) ? getCategoryTags(img.id) : '';
            
            card.innerHTML = `
                <img src="${img.preview_url}" alt="${img.description}" 
                    onerror="this.src='https://via.placeholder.com/300x200?text=Image+Not+Available'">
                <div class="image-info">
                    <div class="text-sm text-gray-600">By: ${img.author}</div>
                    <div class="text-sm text-gray-600">${img.width}x${img.height}</div>
                    ${categoryHtml}
                    <button onclick="event.stopPropagation(); toggleImageSelection('${img.id}')" 
                        class="mt-2 px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">
                        ${selectedImages.has(img.id) ? 'Deselect' : 'Select'}
                    </button>
                </div>
            `;
            
            grid.appendChild(card);
        }

        function toggleImageSelection(imageId) {
            const source = imageId.startsWith('pixabay_') ? 'pixabay' : 'pexels';
            const image = currentImages[source].find(img => img.id === imageId);
            
            if (selectedImages.has(imageId)) {
                selectedImages.delete(imageId);
            } else if (image) {
                selectedImages.set(imageId, { image, category: '' });
            }
            
            // Update all instances of this image card
            document.querySelectorAll(`[data-id="${imageId}"]`).forEach(card => {
                card.className = `image-card ${selectedImages.has(imageId) ? 'selected' : ''}`;
                const infoDiv = card.querySelector('.image-info');
                if (selectedImages.has(imageId)) {
                    const existingTags = infoDiv.querySelector('.category-tags');
                    if (!existingTags) {
                        infoDiv.insertAdjacentHTML('beforeend', getCategoryTags(imageId));
                    }
                } else {
                    const categoryTags = infoDiv.querySelector('.category-tags');
                    if (categoryTags) categoryTags.remove();
                }
                const button = card.querySelector('button');
                button.textContent = selectedImages.has(imageId) ? 'Deselect' : 'Select';
            });
            
            updateSelectedPanel();
        }

        function updateSelectedPanel() {
            const panel = document.getElementById('selectedPanel');
            const container = document.getElementById('selectedImages');
            
            if (selectedImages.size > 0) {
                panel.classList.remove('hidden');
                container.innerHTML = '';
                
                selectedImages.forEach((data, id) => {
                    const div = document.createElement('div');
                    div.className = 'image-card selected';
                    div.setAttribute('data-id', id);
                    div.innerHTML = `
                        <img src="${data.image.preview_url}" alt="${data.image.description}">
                        <div class="image-info">
                            ${getCategoryTags(id)}
                            <button onclick="toggleImageSelection('${id}')" 
                                class="mt-2 px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">
                                Remove
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } else {
                panel.classList.add('hidden');
            }
        }

        async function searchImages() {
            if (isLoading) return;
            
            // Reset pages
            currentPage = { pixabay: 1, pexels: 1 };
            currentImages = { pixabay: [], pexels: [] };
            
            // Clear grids but keep selected images panel
            document.getElementById('pixabayGrid').innerHTML = '';
            document.getElementById('pexelsGrid').innerHTML = '';
            
            await loadImages(true);
        }

        async function loadMore(source) {
            if (isLoading) return;
            currentPage[source]++;
            await loadImages(false);
        }

        async function loadImages(isNewSearch) {
            showLoading();
            try {
                const query = document.getElementById('searchInput').value;
                const timestamp = new Date().getTime();
                const response = await fetch(
                    `/search?query=${encodeURIComponent(query)}&pixabay_page=${currentPage.pixabay}&pexels_page=${currentPage.pexels}&t=${timestamp}`
                );
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Failed to load images');
                }

                // Process Pixabay results
                if (data.results.pixabay.images.length > 0) {
                    const pixabayGrid = document.getElementById('pixabayGrid');
                    data.results.pixabay.images
                        .filter(img => !selectedImages.has(img.id))
                        .forEach(img => addImageToGrid(img, pixabayGrid));
                    currentImages.pixabay = currentImages.pixabay.concat(data.results.pixabay.images);
                }
                document.getElementById('loadMorePixabay').style.display = 
                    data.results.pixabay.hasMore ? 'block' : 'none';

                // Process Pexels results
                if (data.results.pexels.images.length > 0) {
                    const pexelsGrid = document.getElementById('pexelsGrid');
                    data.results.pexels.images
                        .filter(img => !selectedImages.has(img.id))
                        .forEach(img => addImageToGrid(img, pexelsGrid));
                    currentImages.pexels = currentImages.pexels.concat(data.results.pexels.images);
                }
                document.getElementById('loadMorePexels').style.display = 
                    data.results.pexels.hasMore ? 'block' : 'none';

                // If this is a new search, update selected panel
                if (isNewSearch) {
                    updateSelectedPanel();
                }
                
            } catch (error) {
                console.error('Error loading images:', error);
                const errorHtml = `
                    <div class="col-span-full text-center py-8 text-red-500">
                        Error loading images. Please try again.
                    </div>
                `;
                document.getElementById('pixabayGrid').innerHTML += errorHtml;
                document.getElementById('pexelsGrid').innerHTML += errorHtml;
            } finally {
                hideLoading();
            }
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            isLoading = true;
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
            isLoading = false;
        }

        async function downloadSelected() {
            if (selectedImages.size === 0) return;
            
            showLoading();
            try {
                const images = Array.from(selectedImages.entries()).map(([id, data]) => ({
                    id,
                    url: data.image.url,
                    category: data.category
                }));
                
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ images })
                });
                
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || 'Failed to download images');
                }
                
                // Clear selections after successful download
                selectedImages.clear();
                updateSelectedPanel();
                
                // Update all cards to unselected state
                document.querySelectorAll('.image-card').forEach(card => {
                    card.className = 'image-card';
                    const categoryTags = card.querySelector('.category-tags');
                    if (categoryTags) categoryTags.remove();
                    const button = card.querySelector('button');
                    if (button) button.textContent = 'Select';
                });
                
            } catch (error) {
                console.error('Error downloading images:', error);
                alert('Failed to download images. Please try again.');
            } finally {
                hideLoading();
            }
        }

        // Initial search on page load
        searchImages();
    </script>
</body>
</html>
